# preferIPv4Stack: a proxy without IPv6 transit leaves the JVM stalling on
# AAAA records that can never connect, instead of falling back to A records.
# The long HTTP timeouts are for the same reason — the CONNECT to
# dl.google.com succeeds and then the read is slow. Both are safe to drop on
# a network with working IPv6 and direct access to Google's Maven repo.
# 4g: a Compose + dexing build OOM'd at 2g and dumped a 700MB heap into the
# project directory.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true

systemProp.org.gradle.internal.http.connectionTimeout=180000
systemProp.org.gradle.internal.http.socketTimeout=180000

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# This module is small enough that Gradle's default worker count (one per core)
# is pure overhead on a many-core machine — it spawns far more workers than
# there are tasks able to run concurrently, and each costs memory. Capping
# keeps the daemon's footprint sane without slowing anything down.
org.gradle.workers.max=8

# Kotlin compilation in a warm daemon process rather than forking a new JVM per
# build. This is most of the difference between a 20s build and a 7s one.
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# NOTE: on a network where dl.google.com is unreachable, any build that misses
# the configuration cache (i.e. after editing a build file) blocks for ~5
# minutes revalidating dependency metadata. Build with `--offline` to skip it —
# 2.5s instead of 5m — and drop the flag only when adding a new dependency.

kotlin.code.style=official
