name: Android release

# Tagging is the trigger, so a release is always something you asked for
# rather than a side effect of pushing to master. A tag that changes nothing
# under android/ is skipped by the `check` job below. workflow_dispatch is
# there for rebuilding a release without moving a tag, and bypasses that check.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update (e.g. v0.2.0)"
        required: true
        type: string

permissions:
  contents: write # required to create the release and upload the APK

jobs:
  # An `on.push.paths` filter cannot do this: GitHub does not evaluate path
  # filters for tag pushes at all, so the diff has to be taken here. Compare
  # the tag against the previous one on the same history and skip the whole
  # build when nothing under android/ moved, rather than republishing a
  # byte-identical APK under a new version.
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the diff needs history and the earlier tags

      - name: Look for Android changes since the last tag
        id: diff
        run: |
          # workflow_dispatch is the deliberate override: it exists to rebuild
          # a release on demand, so it must not be second-guessed here.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual dispatch — building regardless of the diff."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TAG="${{ github.ref_name }}"
          PREV=$(git describe --tags --abbrev=0 --match 'v*' "${TAG}^" 2>/dev/null || true)

          if [ -z "$PREV" ]; then
            echo "No earlier tag; treating $TAG as the first release."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --quiet "$PREV" "$TAG" -- android/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "### No Android changes in \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Nothing under \`android/\` changed since \`$PREV\`, so no APK was built." >> "$GITHUB_STEP_SUMMARY"
            echo "Re-run this workflow manually with the tag as input to force a build." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Android changes since $PREV:"
            git diff --name-only "$PREV" "$TAG" -- android/
          fi

  build:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest

    # Lifted to job level so the steps below can test it in an `if:`. Neither
    # `secrets` nor a step's own `env:` is in scope for that step's condition —
    # job-level `env` is the only one that is.
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # The tag is the only place a version is written down. Deriving both
      # Android version fields from it here means a release can't ship an APK
      # reporting a number someone forgot to bump in build.gradle.kts.
      #
      # versionCode has to be a single ascending integer, so pack the three
      # parts: 1.2.3 -> 10203. Android refuses to install an APK whose code is
      # lower than the installed one, which is exactly the protection wanted.
      - name: Derive version and F-Droid update metadata from the tag
        id: version
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          python3 -m unittest discover -s scripts/tests -p test_android_release_metadata.py
          python3 scripts/android_release_metadata.py "$RELEASE_TAG" --output carbonpanel-version.json
          python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path
          data = json.loads(Path("carbonpanel-version.json").read_text())
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"tag={data['tag']}\nname={data['versionName']}\ncode={data['versionCode']}\n")
          PYTHON

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action defaults to the removed legacy "tools" package.
          packages: "platform-tools platforms;android-36 build-tools;36.1.0"
          log-accepted-android-sdk-licenses: false

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/libs.versions.toml', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # Optional. With these secrets set the APK is signed with your own key;
      # without them the build falls back to the debug key, which still
      # produces an installable APK (see app/build.gradle.kts). Changing the
      # signing key later means users must uninstall before updating.
      - name: Decode keystore
        id: keystore
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon :app:assembleRelease \
            -PcarbonVersionName="${{ steps.version.outputs.name }}" \
            -PcarbonVersionCode="${{ steps.version.outputs.code }}"

      # Proves which key actually signed the APK. Without this, a
      # misconfigured secret degrades silently to debug signing and nobody
      # notices until users can't install the next update in place.
      - name: Verify signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/certs.txt
          if grep -qi "CN=Android Debug" /tmp/certs.txt; then
            if [ "$HAS_KEYSTORE" = "true" ]; then
              echo "::error::Signing secrets are set but the APK is debug-signed."
              exit 1
            fi
            echo "::warning::APK is debug-signed. Set the KEYSTORE_* secrets to sign with your own key."
          fi

      - name: Name the artifact after the tag
        id: artifact
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          SRC=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "$SRC" ]; then
            echo "No APK produced" >&2
            exit 1
          fi
          DEST="carbonpanel-${TAG}.apk"
          cp "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$DEST" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      # F-Droid must be able to rebuild the release and copy its public
      # signatures. Refuse to publish if a fresh unsigned rebuild differs.
      - name: Verify reproducible APK before publishing
        env:
          SIGNED_APK: ${{ steps.artifact.outputs.path }}
          RELEASE_NAME: ${{ steps.version.outputs.name }}
          RELEASE_CODE: ${{ steps.version.outputs.code }}
        run: |
          python3 -m venv "$RUNNER_TEMP/apksigcopier"
          "$RUNNER_TEMP/apksigcopier/bin/pip" install apksigcopier==1.1.1
          (
            cd android
            ./gradlew --no-daemon --no-build-cache --no-configuration-cache --rerun-tasks \
              :app:clean :app:assembleRelease -PcarbonUnsigned=true \
              -PcarbonVersionName="$RELEASE_NAME" -PcarbonVersionCode="$RELEASE_CODE"
          )
          UNSIGNED_APK=android/app/build/outputs/apk/release/app-release-unsigned.apk
          VERIFIED_APK="$RUNNER_TEMP/reproduced.apk"
          "$RUNNER_TEMP/apksigcopier/bin/apksigcopier" copy "$SIGNED_APK" "$UNSIGNED_APK" "$VERIFIED_APK"
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify "$VERIFIED_APK"
          cmp "$SIGNED_APK" "$VERIFIED_APK"
          echo 'Fresh unsigned rebuild reproduces the signed APK byte for byte.' >> "$GITHUB_STEP_SUMMARY"

      # Kept alongside the release: a workflow run's artifacts expire, but the
      # release asset does not, and this is what you grab to debug a build
      # without waiting for a rerun.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: carbonpanel-apk
          path: |
            ${{ steps.artifact.outputs.path }}
            carbonpanel-version.json
          retention-days: 14

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: CarbonPanel ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            ${{ steps.artifact.outputs.path }}
            carbonpanel-version.json
          body: |
            ### CarbonPanel for Android — ${{ steps.version.outputs.tag }}

            **SHA-256**
            ```
            ${{ steps.artifact.outputs.sha256 }}
            ```

            Install by sideloading the APK. Pair it from the web panel under
            **Settings → Paired Devices** — the QR carries the server's
            addresses, so no password is typed on the phone.

            If this build is signed with a different key than the one you have
            installed, Android will refuse to update in place and you'll need
            to uninstall first.
